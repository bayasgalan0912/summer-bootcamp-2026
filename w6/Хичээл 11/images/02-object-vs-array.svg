<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" rx="24" fill="url(#bg6b)"/>
  <text x="450" y="56" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800">JSON-ийн 2 хэлбэр</text>

  <!-- OBJECT -->
  <rect x="40" y="90" width="380" height="380" rx="20" fill="#1b2348" stroke="#ffd84d" stroke-width="3"/>
  <text x="230" y="135" text-anchor="middle" fill="#ffd84d" font-size="26" font-weight="800">{ }  Object</text>
  <text x="230" y="166" text-anchor="middle" fill="#cdd3f5" font-size="18">= НЭГ зүйлийн "шошготой хайрцаг"</text>

  <!-- labeled box -->
  <rect x="90" y="195" width="280" height="220" rx="14" fill="#0e1430" stroke="#ffd84d" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="230" y="225" text-anchor="middle" font-size="40">📦</text>
  <g font-size="17">
    <rect x="110" y="245" width="240" height="38" rx="8" fill="#22305f"/>
    <text x="125" y="270" fill="#8dd2ff">question:</text><text x="345" y="270" text-anchor="end" fill="#fff">"..."</text>
    <rect x="110" y="291" width="240" height="38" rx="8" fill="#22305f"/>
    <text x="125" y="316" fill="#8dd2ff">emojis:</text><text x="345" y="316" text-anchor="end" fill="#fff">🏴‍☠️👒</text>
    <rect x="110" y="337" width="240" height="38" rx="8" fill="#22305f"/>
    <text x="125" y="362" fill="#8dd2ff">answer:</text><text x="345" y="362" text-anchor="end" fill="#fff">"One Piece"</text>
  </g>
  <text x="230" y="448" text-anchor="middle" fill="#9aa3d6" font-size="15">шошго (key) → утга (value)</text>

  <!-- ARRAY -->
  <rect x="480" y="90" width="380" height="380" rx="20" fill="#1b2348" stroke="#52b9ff" stroke-width="3"/>
  <text x="670" y="135" text-anchor="middle" fill="#8dd2ff" font-size="26" font-weight="800">[ ]  Array</text>
  <text x="670" y="166" text-anchor="middle" fill="#cdd3f5" font-size="18">= ОЛОН зүйлийн "жагсаалт"</text>

  <!-- queue of boxes -->
  <g>
    <rect x="525" y="210" width="290" height="60" rx="10" fill="#22305f" stroke="#52b9ff"/>
    <text x="545" y="247" font-size="30">📦</text><text x="595" y="248" fill="#fff" font-size="18">асуулт 1</text>
    <rect x="525" y="285" width="290" height="60" rx="10" fill="#22305f" stroke="#52b9ff"/>
    <text x="545" y="322" font-size="30">📦</text><text x="595" y="323" fill="#fff" font-size="18">асуулт 2</text>
    <rect x="525" y="360" width="290" height="60" rx="10" fill="#22305f" stroke="#52b9ff"/>
    <text x="545" y="397" font-size="30">📦</text><text x="595" y="398" fill="#fff" font-size="18">асуулт 3</text>
  </g>
  <text x="670" y="448" text-anchor="middle" fill="#9aa3d6" font-size="15">эгнээнд зогссон сурагчид шиг</text>

  <text x="450" y="500" text-anchor="middle" fill="#ffd84d" font-size="18" font-weight="700">💡 { } = нэг зүйл   ·   [ ] = олон зүйлийн жагсаалт</text>
</svg>
