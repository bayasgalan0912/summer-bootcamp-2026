<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" rx="24" fill="url(#bg6d)"/>
  <text x="450" y="54" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800">🎲 Тоглоомын дүрэм = тоглоомын "тархи"</text>
  <text x="450" y="90" text-anchor="middle" fill="#9aa3d6" font-size="18">Эдгээр 4 тохиргоог чи өөрөө шийднэ 👇</text>

  <!-- 4 dials -->
  <g>
    <rect x="50" y="130" width="190" height="230" rx="18" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="145" y="195" text-anchor="middle" font-size="52">⏱️</text>
    <text x="145" y="245" text-anchor="middle" fill="#8dd2ff" font-size="20" font-weight="700">ХУГАЦАА</text>
    <text x="145" y="285" text-anchor="middle" fill="#cdd3f5" font-size="15">Асуулт бүрт</text>
    <text x="145" y="320" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">15 сек?</text>
  </g>
  <g>
    <rect x="255" y="130" width="190" height="230" rx="18" fill="#2a1430" stroke="#ff5470" stroke-width="3"/>
    <text x="350" y="195" text-anchor="middle" font-size="52">❤️</text>
    <text x="350" y="245" text-anchor="middle" fill="#ff8da0" font-size="20" font-weight="700">АМЬ</text>
    <text x="350" y="285" text-anchor="middle" fill="#cdd3f5" font-size="15">Хэдэн буруу бол</text>
    <text x="350" y="320" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3 амь?</text>
  </g>
  <g>
    <rect x="460" y="130" width="190" height="230" rx="18" fill="#2a2150" stroke="#ffd84d" stroke-width="3"/>
    <text x="555" y="195" text-anchor="middle" font-size="52">⭐</text>
    <text x="555" y="245" text-anchor="middle" fill="#ffe57a" font-size="20" font-weight="700">ОНОО</text>
    <text x="555" y="285" text-anchor="middle" fill="#cdd3f5" font-size="15">Зөв бол</text>
    <text x="555" y="320" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">+10 оноо?</text>
  </g>
  <g>
    <rect x="665" y="130" width="190" height="230" rx="18" fill="#14302a" stroke="#3ddc97" stroke-width="3"/>
    <text x="760" y="195" text-anchor="middle" font-size="52">🔥</text>
    <text x="760" y="245" text-anchor="middle" fill="#7af0c0" font-size="20" font-weight="700">BONUS</text>
    <text x="760" y="285" text-anchor="middle" fill="#cdd3f5" font-size="15">Дараалан зөв бол</text>
    <text x="760" y="320" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">+20?</text>
  </g>

  <text x="450" y="420" text-anchor="middle" fill="#ffd84d" font-size="19" font-weight="700">💡 Эдгээрийг өөрчилбөл тоглоомын мэдрэмж бүрэн өөр болно!</text>
</svg>
