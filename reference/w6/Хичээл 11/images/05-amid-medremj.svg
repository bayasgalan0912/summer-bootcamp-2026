<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6e" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="440" rx="24" fill="url(#bg6e)"/>
  <text x="450" y="54" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800">✨ Тоглоомоо "амьд" болгох</text>
  <text x="450" y="90" text-anchor="middle" fill="#9aa3d6" font-size="18">Жижиг эффект → том ялгаа</text>

  <!-- hover -->
  <rect x="50" y="130" width="250" height="240" rx="18" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
  <text x="175" y="200" text-anchor="middle" font-size="56">🖱️</text>
  <text x="175" y="250" text-anchor="middle" fill="#8dd2ff" font-size="22" font-weight="700">Hover</text>
  <text x="175" y="288" text-anchor="middle" fill="#cdd3f5" font-size="16">Хулгана дээр нь</text>
  <text x="175" y="312" text-anchor="middle" fill="#cdd3f5" font-size="16">очвол товч</text>
  <text x="175" y="340" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">томорч гэрэлтэнэ</text>

  <!-- select -->
  <rect x="325" y="130" width="250" height="240" rx="18" fill="#14302a" stroke="#3ddc97" stroke-width="3"/>
  <text x="450" y="200" text-anchor="middle" font-size="56">✅❌</text>
  <text x="450" y="250" text-anchor="middle" fill="#7af0c0" font-size="22" font-weight="700">Select</text>
  <text x="450" y="288" text-anchor="middle" fill="#cdd3f5" font-size="16">Зөв бол ногоон,</text>
  <text x="450" y="312" text-anchor="middle" fill="#cdd3f5" font-size="16">буруу бол улаан</text>
  <text x="450" y="340" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">+ сэгсрэх animation</text>

  <!-- sound -->
  <rect x="600" y="130" width="250" height="240" rx="18" fill="#2a2150" stroke="#ffd84d" stroke-width="3"/>
  <text x="725" y="200" text-anchor="middle" font-size="56">🔊</text>
  <text x="725" y="250" text-anchor="middle" fill="#ffe57a" font-size="22" font-weight="700">Sound</text>
  <text x="725" y="288" text-anchor="middle" fill="#cdd3f5" font-size="16">Зөв → "ding!" 🎵</text>
  <text x="725" y="312" text-anchor="middle" fill="#cdd3f5" font-size="16">Буруу → "buzz" 🔕</text>
  <text x="725" y="340" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">дуун эффект</text>
</svg>
