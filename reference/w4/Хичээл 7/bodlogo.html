    // ← энд бич
    check("5", reversed, [100, 60, 80, 95, 70]);

    let names = ["Бат", "Дорж", "Сараа", "Тэмүүлэн"];
    let where = -1;
    // ← энд бич
    check("6", where, 2);

    // Бонус: Хамгийн урт нэр (Зөвлөгөө: names[i].length)
    let longest = "";
    // ← энд бич
    check("бонус", longest, "Тэмүүлэн");
  </script>
