<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg8a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" rx="24" fill="url(#bg8a)"/>

  <text x="450" y="50" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">Sprite sheet = frame-үүд НЭГ зурагт</text>
  <text x="450" y="82" text-anchor="middle" fill="#9aa3d6" font-size="18">Нүд бүр яг 256×256. Зүүнээс баруун тийш, дараа нь дараагийн мөр.</text>

  <!-- grid 5 x 2 -->
  <g>
    <rect x="150" y="118" width="120" height="120" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="210" y="188" text-anchor="middle" font-size="38">🧍</text>
    <text x="210" y="222" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">0</text>

    <rect x="270" y="118" width="120" height="120" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="330" y="188" text-anchor="middle" font-size="38">🧍</text>
    <text x="330" y="222" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">1</text>

    <rect x="390" y="118" width="120" height="120" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="450" y="188" text-anchor="middle" font-size="38">👊</text>
    <text x="450" y="222" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">2</text>

    <rect x="510" y="118" width="120" height="120" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="570" y="188" text-anchor="middle" font-size="38">👊</text>
    <text x="570" y="222" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">3</text>

    <rect x="630" y="118" width="120" height="120" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="690" y="188" text-anchor="middle" font-size="38">🧍</text>
    <text x="690" y="222" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">4</text>

    <rect x="150" y="238" width="120" height="120" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="210" y="308" text-anchor="middle" font-size="38">🧍</text>
    <text x="210" y="342" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">5</text>

    <g fill="#141a3a" stroke="#2c3567" stroke-width="2" stroke-dasharray="6 5">
      <rect x="270" y="238" width="120" height="120"/>
      <rect x="390" y="238" width="120" height="120"/>
      <rect x="510" y="238" width="120" height="120"/>
      <rect x="630" y="238" width="120" height="120"/>
    </g>
    <text x="570" y="305" text-anchor="middle" fill="#5f68a8" font-size="15">хоосон нүд — зүгээр орхиод болно</text>
  </g>

  <!-- annotations -->
  <line x1="150" y1="102" x2="270" y2="102" stroke="#ffd84d" stroke-width="2"/>
  <line x1="150" y1="94" x2="150" y2="110" stroke="#ffd84d" stroke-width="2"/>
  <line x1="270" y1="94" x2="270" y2="110" stroke="#ffd84d" stroke-width="2"/>
  <text x="210" y="90" text-anchor="middle" fill="#ffd84d" font-size="15" font-weight="700">256 px</text>

  <line x1="134" y1="118" x2="134" y2="238" stroke="#ffd84d" stroke-width="2"/>
  <line x1="126" y1="118" x2="142" y2="118" stroke="#ffd84d" stroke-width="2"/>
  <line x1="126" y1="238" x2="142" y2="238" stroke="#ffd84d" stroke-width="2"/>
  <text x="112" y="178" text-anchor="middle" fill="#ffd84d" font-size="15" font-weight="700" transform="rotate(-90 112 178)">256 px</text>

  <text x="790" y="182" fill="#7de08a" font-size="15" font-weight="700">мөр 0</text>
  <text x="790" y="302" fill="#7de08a" font-size="15" font-weight="700">мөр 1</text>

  <text x="450" y="386" text-anchor="middle" fill="#7de08a" font-size="16" font-weight="700">5 багана × 256 = 1280 px өргөн · 2 мөр × 256 = 512 px өндөр · 6 frame</text>

  <rect x="80" y="410" width="740" height="106" rx="14" fill="#141a3a" stroke="#2c3567" stroke-width="2"/>
  <text x="106" y="440" fill="#ffffff" font-size="17" font-weight="700">N дугаартай frame-ийг олох томьёо:</text>
  <text x="106" y="468" fill="#8dd2ff" font-size="16" font-family="monospace">багана = N % cols        мөр = N / cols (бүхэл хэсэг)</text>
  <text x="106" y="492" fill="#8dd2ff" font-size="16" font-family="monospace">background-position = -(багана × 256)px  -(мөр × 256)px</text>
  <text x="106" y="510" fill="#7f88c4" font-size="13">жишээ: N=7, cols=5 → багана 2, мөр 1 → -512px -256px</text>
</svg>
