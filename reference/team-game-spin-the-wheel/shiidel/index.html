<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Urgoo Cinemas</title>
  <style>
    body {
      background-color: #0b0b0f;
      color: white;
      font-family: Arial;
      margin: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #333;
    }
    .header button {
      background-color: #1e90ff;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 14px 30px;
      font-size: 16px;
    }
    h2 {
      margin: 15px 10px;
    }
    .kinonuud {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 10px;
    }
    .kinonuud img {
      width: 166px;
      border: 1px solid #333;
      border-radius: 6px;
    }
    .kinonuud img:hover {
      border-color: #1e90ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../img/logo.png">
    <button>Нэвтрэх</button>
  </div>

  <h2>Яг одоо дэлгэцнээ</h2>
  <div class="kinonuud">
    <img src="../img/nehel.png">
    <img src="../img/sain-uu.png">
    <img src="../img/ovgor.png">
    <img src="../img/clayface.png">
    <img src="../img/street-fighter.png">
  </div>

  <h2>Урьдчилсан захиалга</h2>
  <div class="kinonuud">
    <img src="../img/avengers.png">
    <img src="../img/dune.png">
  </div>
</body>
</html>
