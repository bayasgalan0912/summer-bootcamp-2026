<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>3 хайрцаг</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    /* Эцэг хайрцаг — flex-ийг ЭНД бичнэ */
    .parent {
      height: 240px;
      border: 4px dashed #7c3aed;
      background: #f5f3ff;
      /* ↓ энд мөр нэмж туршаарай */

    }

    /* Хүүхэд хайрцгууд */
    .box {
      width: 70px;
      height: 70px;
      color: white;
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      line-height: 70px;
      border-radius: 10px;
    }

    #b1 {
      background: #ef4444;
    }

    #b2 {
      background: #f59e0b;
    }

    #b3 {
      background: #22c55e;
    }
  </style>
</head>

<body>
  <div class="parent">
    <div class="box" id="b1">1</div>
    <div class="box" id="b2">2</div>
    <div class="box" id="b3">3</div>
  </div>
</body>

</html>
