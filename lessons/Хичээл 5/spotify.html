<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Spotify</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* 1 */
    .app {
      /* ? */
    }

    /* 2 */
    .sidebar {
      width: 180px;
      padding: 20px;
      background: #121212;
      /* ? */
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #1db954;
    }

    .sidebar a {
      color: #b3b3b3;
    }

    .main {
      flex: 1;
      padding: 20px 30px;
      background: #1e1e1e;
    }

    /* 3 */
    .top {
      /* ? */
    }

    /* 4 */
    .buttons {
      /* ? */
    }

    .buttons button {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background: white;
      font-weight: bold;
    }

    .me {
      font-size: 24px;
    }

    /* 5 */
    .albums {
      /* ? */
    }

    /* 6 */
    .album {
      width: 130px;
      padding: 12px;
      background: #2a2a2a;
      border-radius: 10px;
      text-align: center;
      /* ? */
    }

    /* 7 */
    .cover {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      font-size: 50px;
      /* ? */
    }

    .album p {
      margin: 4px 0 0;
      color: #b3b3b3;
      font-size: 13px;
    }

    .album b {
      margin-top: 10px;
    }

    /* 8 */
    .player {
      padding: 12px 20px;
      background: #181818;
      border-top: 1px solid #333;
      /* ? */
    }

    /* 9 */
    .song {
      /* ? */
    }

    .small {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      background: #ef4444;
    }

    .song p {
      margin: 0;
      color: #b3b3b3;
      font-size: 13px;
    }

    /* 10 */
    .controls {
      font-size: 22px;
      /* ? */
    }

    .play {
      background: white;
      color: black;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      text-align: center;
      line-height: 40px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="sidebar">
      <div class="logo">🎧 Spotify</div>
      <a>🏠 Нүүр</a>
      <a>🔍 Хайх</a>
      <a>📚 Миний сан</a>
      <a>❤️ Дуртай дуу</a>
    </div>

    <div class="main">
      <div class="top">
        <h1>Өглөөний мэнд!</h1>
        <div class="buttons">
          <button>Premium</button>
          <span class="me">👤</span>
        </div>
      </div>

      <h2>Чамд зориулав</h2>

      <div class="albums">
        <div class="album">
          <div class="cover" style="background: #ef4444">🎸</div>
          <b>Rock хит</b>
          <p>Хүчтэй дуунууд</p>
        </div>
        <div class="album">
          <div class="cover" style="background: #8b5cf6">🎤</div>
          <b>Монгол поп</b>
          <p>Шинэ дуунууд</p>
        </div>
        <div class="album">
          <div class="cover" style="background: #f59e0b">🎮</div>
          <b>Тоглоомын хөгжим</b>
          <p>Minecraft, Roblox</p>
        </div>
        <div class="album">
          <div class="cover" style="background: #22c55e">🐎</div>
          <b>Морин хуур</b>
          <p>Ардын аялгуу</p>
        </div>
        <div class="album">
          <div class="cover" style="background: #3b82f6">📚</div>
          <b>Хичээл хийх</b>
          <p>Тайван хөгжим</p>
        </div>
      </div>
    </div>
  </div>

  <div class="player">
    <div class="song">
      <div class="small"></div>
      <div>
        <b>Миний дуу</b>
        <p>Хамтлаг</p>
      </div>
    </div>
    <div class="controls">
      <span>⏮</span>
      <span class="play">▶</span>
      <span>⏭</span>
    </div>
    <div class="volume">🔊 ━━━━━</div>
  </div>
</body>

</html>
