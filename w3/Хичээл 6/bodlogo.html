      const ok = JSON.stringify(got) === JSON.stringify(want);
      console.log(ok ? "✅" : "❌", name, "→", got);
    }

    // 1. 1-ээс 100 хүртэлх тоонуудын нийлбэр
    let sum1 = 0;
    // ← энд бич
    check("1", sum1, 5050);

    let sum2 = 0;
    // ← энд бич
    check("2", sum2, 30);

    // 3. 5! = 1 × 2 × 3 × 4 × 5
    let fact = 1;
    // ← энд бич
    check("3", fact, 120);

    // 4. "ha"-г 3 удаа залга → "hahaha"
    let laugh = "";
    // ← энд бич
    check("4", laugh, "hahaha");

    // 5. 1-ээс 100 хүртэл 3-т ЭСВЭЛ 5-д хуваагддаг тоо хэд байна?
    let count = 0;
    // ← энд бич
    check("5", count, 47);

    // 6. 1000₮ жил бүр 2 дахин өсвөл хэдэн жилийн дараа 10000₮-өөс давах вэ? (while)
    let money = 1000;
    let years = 0;
    // ← энд бич
    check("6", years, 4);

  </script>
