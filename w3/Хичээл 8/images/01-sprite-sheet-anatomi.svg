<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg8a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" rx="24" fill="url(#bg8a)"/>

  <text x="450" y="52" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">Sprite sheet = frame-үүд НЭГ зурагт</text>
  <text x="450" y="84" text-anchor="middle" fill="#9aa3d6" font-size="18">Нэг анимаци = нэг мөр. Нүд бүр яг ижил хэмжээтэй.</text>

  <!-- strip -->
  <g>
    <rect x="70" y="130" width="190" height="143" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="165" y="215" text-anchor="middle" font-size="52">🧍</text>
    <text x="165" y="256" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">frame 0</text>

    <rect x="260" y="130" width="190" height="143" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="355" y="215" text-anchor="middle" font-size="52">🦵</text>
    <text x="355" y="256" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">frame 1</text>

    <rect x="450" y="130" width="190" height="143" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="545" y="215" text-anchor="middle" font-size="52">🥋</text>
    <text x="545" y="256" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">frame 2</text>

    <rect x="640" y="130" width="190" height="143" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="735" y="215" text-anchor="middle" font-size="52">🧍</text>
    <text x="735" y="256" text-anchor="middle" fill="#8dd2ff" font-size="15" font-weight="700">frame 3</text>
  </g>

  <!-- cell size annotation -->
  <line x1="70" y1="112" x2="260" y2="112" stroke="#ffd84d" stroke-width="2"/>
  <line x1="70" y1="104" x2="70" y2="120" stroke="#ffd84d" stroke-width="2"/>
  <line x1="260" y1="104" x2="260" y2="120" stroke="#ffd84d" stroke-width="2"/>
  <text x="165" y="100" text-anchor="middle" fill="#ffd84d" font-size="16" font-weight="700">256 px</text>

  <line x1="52" y1="130" x2="52" y2="273" stroke="#ffd84d" stroke-width="2"/>
  <line x1="44" y1="130" x2="60" y2="130" stroke="#ffd84d" stroke-width="2"/>
  <line x1="44" y1="273" x2="60" y2="273" stroke="#ffd84d" stroke-width="2"/>
  <text x="30" y="207" text-anchor="middle" fill="#ffd84d" font-size="16" font-weight="700" transform="rotate(-90 30 207)">192 px</text>

  <!-- total -->
  <line x1="70" y1="296" x2="830" y2="296" stroke="#7de08a" stroke-width="2"/>
  <line x1="70" y1="288" x2="70" y2="304" stroke="#7de08a" stroke-width="2"/>
  <line x1="830" y1="288" x2="830" y2="304" stroke="#7de08a" stroke-width="2"/>
  <text x="450" y="322" text-anchor="middle" fill="#7de08a" font-size="17" font-weight="700">нийт өргөн = 256 × 4 = 1024 px</text>

  <rect x="70" y="346" width="760" height="88" rx="14" fill="#141a3a" stroke="#2c3567" stroke-width="2"/>
  <text x="96" y="378" fill="#ffffff" font-size="17" font-weight="700">Тоглоом frame-ийг ингэж сольдог:</text>
  <text x="96" y="406" fill="#8dd2ff" font-size="16" font-family="monospace">background-position-x = -(frame дугаар × 256) px</text>
  <text x="96" y="426" fill="#7f88c4" font-size="14">frame 0 → 0px · frame 1 → −256px · frame 2 → −512px · frame 3 → −768px</text>
</svg>
