<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg6a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" rx="24" fill="url(#bg6a)"/>
  <text x="450" y="60" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="800">🎮 Тоглоом юунаас бүтдэг вэ?</text>
  <text x="450" y="98" text-anchor="middle" fill="#9aa3d6" font-size="20">Аливаа тоглоом 3 хэсэгтэй</text>

  <!-- Part 1 -->
  <g>
    <rect x="50" y="150" width="240" height="270" rx="20" fill="#1f2750" stroke="#ff52d9" stroke-width="3"/>
    <text x="170" y="215" text-anchor="middle" font-size="60">🎨</text>
    <text x="170" y="265" text-anchor="middle" fill="#ff8df0" font-size="24" font-weight="700">Дүр төрх</text>
    <text x="170" y="300" text-anchor="middle" fill="#cdd3f5" font-size="17">Юу харагдах вэ?</text>
    <text x="170" y="345" text-anchor="middle" fill="#7f88c4" font-size="15">өнгө, товч, зураг</text>
    <text x="170" y="372" text-anchor="middle" fill="#5f68a8" font-size="14">(HTML / CSS)</text>
  </g>

  <!-- Part 2 -->
  <g>
    <rect x="330" y="150" width="240" height="270" rx="20" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
    <text x="450" y="215" text-anchor="middle" font-size="60">🧠</text>
    <text x="450" y="265" text-anchor="middle" fill="#8dd2ff" font-size="24" font-weight="700">Тархи</text>
    <text x="450" y="300" text-anchor="middle" fill="#cdd3f5" font-size="17">Яаж ажиллах вэ?</text>
    <text x="450" y="345" text-anchor="middle" fill="#7f88c4" font-size="15">дүрэм, оноо тоолох</text>
    <text x="450" y="372" text-anchor="middle" fill="#5f68a8" font-size="14">(код)</text>
  </g>

  <!-- Part 3 -->
  <g>
    <rect x="610" y="150" width="240" height="270" rx="20" fill="#2a2150" stroke="#ffd84d" stroke-width="4"/>
    <text x="730" y="215" text-anchor="middle" font-size="60">📦</text>
    <text x="730" y="265" text-anchor="middle" fill="#ffe57a" font-size="24" font-weight="700">Мэдээлэл</text>
    <text x="730" y="300" text-anchor="middle" fill="#cdd3f5" font-size="17">Юуны тухай вэ?</text>
    <text x="730" y="345" text-anchor="middle" fill="#7f88c4" font-size="15">асуулт, хариулт</text>
    <text x="730" y="372" text-anchor="middle" fill="#ffd84d" font-size="15" font-weight="700">(JSON ← өнөөдөр!)</text>
  </g>

  <text x="450" y="468" text-anchor="middle" fill="#ffd84d" font-size="19" font-weight="700">👉 Өнөөдөр бид "Мэдээлэл" хэсгийг бүтээж сурна</text>
</svg>
