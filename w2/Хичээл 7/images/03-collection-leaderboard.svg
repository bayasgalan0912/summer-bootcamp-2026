<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg7c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" rx="24" fill="url(#bg7c)"/>
  <text x="450" y="52" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">📂 Оноо хэрхэн эмх цэгцтэй хадгалагддаг вэ?</text>

  <!-- collection -->
  <rect x="40" y="90" width="430" height="390" rx="18" fill="#1b2348" stroke="#ffb74d" stroke-width="3"/>
  <text x="255" y="128" text-anchor="middle" fill="#ffd84d" font-size="20" font-weight="800">📂 "scores" Collection</text>
  <text x="255" y="152" text-anchor="middle" fill="#9aa3d6" font-size="15">= хавтас (оноонуудын цуглуулга)</text>

  <!-- documents -->
  <g font-size="15">
    <rect x="70" y="170" width="370" height="86" rx="12" fill="#0e1430" stroke="#52b9ff" stroke-width="2"/>
    <text x="88" y="195" fill="#8dd2ff" font-size="14">📄 Document</text>
    <text x="88" y="222" fill="#fff">name: <tspan fill="#7af0c0">"Сараа"</tspan></text>
    <text x="88" y="246" fill="#fff">score: <tspan fill="#ffd84d">95</tspan></text>

    <rect x="70" y="266" width="370" height="86" rx="12" fill="#0e1430" stroke="#52b9ff" stroke-width="2"/>
    <text x="88" y="291" fill="#8dd2ff" font-size="14">📄 Document</text>
    <text x="88" y="318" fill="#fff">name: <tspan fill="#7af0c0">"Болд"</tspan></text>
    <text x="88" y="342" fill="#fff">score: <tspan fill="#ffd84d">80</tspan></text>

    <rect x="70" y="362" width="370" height="86" rx="12" fill="#0e1430" stroke="#52b9ff" stroke-width="2"/>
    <text x="88" y="387" fill="#8dd2ff" font-size="14">📄 Document</text>
    <text x="88" y="414" fill="#fff">name: <tspan fill="#7af0c0">"Ану"</tspan></text>
    <text x="88" y="438" fill="#fff">score: <tspan fill="#ffd84d">88</tspan></text>
  </g>

  <!-- arrow -->
  <text x="510" y="290" text-anchor="middle" font-size="46">➡️</text>
  <text x="510" y="330" text-anchor="middle" fill="#9aa3d6" font-size="14">оноогоор</text>
  <text x="510" y="350" text-anchor="middle" fill="#9aa3d6" font-size="14">эрэмбэлбэл</text>

  <!-- leaderboard -->
  <rect x="560" y="120" width="300" height="330" rx="18" fill="#2a2150" stroke="#ffd84d" stroke-width="3"/>
  <text x="710" y="160" text-anchor="middle" fill="#ffe57a" font-size="22" font-weight="800">🏆 Leaderboard</text>
  <g font-size="19">
    <rect x="585" y="185" width="250" height="60" rx="10" fill="#3a2f63"/>
    <text x="605" y="222" fill="#ffd84d">🥇 Сараа</text><text x="815" y="222" text-anchor="end" fill="#fff">95</text>
    <rect x="585" y="255" width="250" height="60" rx="10" fill="#332a57"/>
    <text x="605" y="292" fill="#cfd6f5">🥈 Ану</text><text x="815" y="292" text-anchor="end" fill="#fff">88</text>
    <rect x="585" y="325" width="250" height="60" rx="10" fill="#2c2550"/>
    <text x="605" y="362" fill="#cfa46a">🥉 Болд</text><text x="815" y="362" text-anchor="end" fill="#fff">80</text>
  </g>
  <text x="710" y="425" text-anchor="middle" fill="#9aa3d6" font-size="14">хамгийн өндөр оноо дээр</text>

  <text x="450" y="505" text-anchor="middle" fill="#7af0c0" font-size="16" font-weight="700">Collection 📂 дотор Document 📄-ууд → эрэмбэлбэл Leaderboard 🏆</text>
