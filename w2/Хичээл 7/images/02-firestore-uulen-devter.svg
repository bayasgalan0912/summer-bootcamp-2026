<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg7b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" rx="24" fill="url(#bg7b)"/>
  <text x="450" y="54" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800">☁️ Firestore = үүлэн дэх дэвтэр</text>
  <text x="450" y="90" text-anchor="middle" fill="#9aa3d6" font-size="18">Бүх тоглогч нэг дэвтрийг хуваалцана</text>

  <!-- cloud DB -->
  <ellipse cx="450" cy="200" rx="160" ry="80" fill="#1b2348" stroke="#ffb74d" stroke-width="3"/>
  <text x="450" y="185" text-anchor="middle" font-size="40">📒</text>
  <text x="450" y="225" text-anchor="middle" fill="#ffd84d" font-size="22" font-weight="800">Firestore</text>
  <text x="450" y="252" text-anchor="middle" fill="#9aa3d6" font-size="15">(Google-ийн үүлэн DB)</text>

  <!-- players -->
  <g font-size="16" text-anchor="middle">
    <circle cx="130" cy="400" r="50" fill="#22305f" stroke="#52b9ff" stroke-width="2"/>
    <text x="130" y="392" font-size="34">🧒</text><text x="130" y="425" fill="#fff">Болд: 80</text>

    <circle cx="340" cy="430" r="50" fill="#22305f" stroke="#52b9ff" stroke-width="2"/>
    <text x="340" y="422" font-size="34">👧</text><text x="340" y="455" fill="#fff">Сараа: 95</text>

    <circle cx="560" cy="430" r="50" fill="#22305f" stroke="#52b9ff" stroke-width="2"/>
    <text x="560" y="422" font-size="34">🧑</text><text x="560" y="455" fill="#fff">Тэмүүлэн: 70</text>

    <circle cx="770" cy="400" r="50" fill="#22305f" stroke="#52b9ff" stroke-width="2"/>
    <text x="770" y="392" font-size="34">👦</text><text x="770" y="425" fill="#fff">Ану: 88</text>
  </g>

  <!-- arrows from players to cloud -->
  <g stroke="#52b9ff" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M150 352 L370 250" marker-end="url(#a7)"/>
    <path d="M345 380 L430 280" marker-end="url(#a7)"/>
    <path d="M555 380 L475 280" marker-end="url(#a7)"/>
    <path d="M750 352 L530 250" marker-end="url(#a7)"/>
  </g>
  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#52b9ff"/>
    </marker>
  </defs>

  <text x="450" y="305" text-anchor="middle" fill="#7af0c0" font-size="15">↑ хүн бүрийн оноо нэг дор хадгалагдана ↑</text>
</svg>
