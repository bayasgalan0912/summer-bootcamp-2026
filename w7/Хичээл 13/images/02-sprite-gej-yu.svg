<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg7b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
    <pattern id="chk7" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#dfe3f5"/>
      <rect width="10" height="10" fill="#b9bfd8"/>
      <rect x="10" y="10" width="10" height="10" fill="#b9bfd8"/>
    </pattern>
  </defs>
  <rect width="900" height="520" rx="24" fill="url(#bg7b)"/>
  <text x="450" y="56" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800">🎨 Sprite гэж юу вэ?</text>
  <text x="450" y="90" text-anchor="middle" fill="#9aa3d6" font-size="19">Sprite = тоглоомд хэрэглэдэг <tspan fill="#ffd84d" font-weight="700">дэвсгэргүй</tspan> нэг дүрсний зураг (PNG)</text>

  <!-- GOOD -->
  <rect x="50" y="120" width="380" height="330" rx="20" fill="#132a20" stroke="#4ee6a8" stroke-width="3"/>
  <text x="240" y="158" text-anchor="middle" fill="#8bf3cd" font-size="24" font-weight="800">✅ ЗӨВ sprite</text>
  <rect x="150" y="176" width="180" height="200" rx="8" fill="url(#chk7)"/>
  <text x="240" y="300" text-anchor="middle" font-size="110">🥋</text>
  <line x1="150" y1="376" x2="330" y2="376" stroke="#4ee6a8" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="240" y="398" text-anchor="middle" fill="#4ee6a8" font-size="13">↑ хөл зургийн ДООД захад</text>
  <g font-size="15" fill="#cdd3f5">
    <text x="80" y="424">✔ transparent background (шалмаг дөрвөлжин)</text>
    <text x="80" y="444">✔ side view · full body · нэг л дүр</text>
  </g>

  <!-- BAD -->
  <rect x="470" y="120" width="380" height="330" rx="20" fill="#2e1620" stroke="#ff6b6b" stroke-width="3"/>
  <text x="660" y="158" text-anchor="middle" fill="#ff9d9d" font-size="24" font-weight="800">❌ БУРУУ sprite</text>

  <rect x="500" y="180" width="105" height="130" rx="8" fill="#6d7fb8"/>
  <text x="552" y="270" text-anchor="middle" font-size="52">🧍</text>
  <text x="552" y="330" text-anchor="middle" fill="#ff9d9d" font-size="13">дэвсгэртэй</text>

  <rect x="617" y="180" width="105" height="130" rx="8" fill="url(#chk7)"/>
  <text x="669" y="272" text-anchor="middle" font-size="52">😀</text>
  <text x="669" y="330" text-anchor="middle" fill="#ff9d9d" font-size="13">зөвхөн толгой</text>

  <rect x="734" y="180" width="105" height="130" rx="8" fill="url(#chk7)"/>
  <text x="786" y="272" text-anchor="middle" font-size="52">👥</text>
  <text x="786" y="330" text-anchor="middle" fill="#ff9d9d" font-size="13">2 дүр нэг зурагт</text>

  <g font-size="15" fill="#e8c9c9">
    <text x="500" y="366">✖ цагаан/өнгөт дэвсгэр → дөрвөлжин хайрцаг харагдана</text>
    <text x="500" y="388">✖ хагас бие, эсвэл нүүрээрээ харсан (front view)</text>
    <text x="500" y="410">✖ 2 дүр, эсвэл текст, хүрээ орсон</text>
    <text x="500" y="436" fill="#ff9d9d" font-weight="700">→ Тоглоомд хэрэглэх боломжгүй!</text>
  </g>

  <text x="450" y="490" text-anchor="middle" fill="#ffd84d" font-size="18" font-weight="700">🔑 Тулааны тоглоом = хажуугаас харсан (side view) бүтэн бие</text>
</svg>
