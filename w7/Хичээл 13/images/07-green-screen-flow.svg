<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg7g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#161b3d"/>
    </linearGradient>
    <pattern id="chk7b" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#dfe3f5"/>
      <rect width="9" height="9" fill="#b9bfd8"/>
      <rect x="9" y="9" width="9" height="9" fill="#b9bfd8"/>
    </pattern>
  </defs>
  <rect width="900" height="500" rx="24" fill="url(#bg7g)"/>
  <text x="450" y="54" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">🟩 Мэргэжлийн заль — GREEN SCREEN</text>
  <text x="450" y="88" text-anchor="middle" fill="#9aa3d6" font-size="18">"transparent" гэж гуйхаас <tspan fill="#4ee6a8" font-weight="700">хамаагүй найдвартай</tspan> ажилладаг</text>

  <!-- step 1 -->
  <rect x="45" y="120" width="230" height="230" rx="18" fill="#1f2750" stroke="#4ee6a8" stroke-width="3"/>
  <text x="160" y="152" text-anchor="middle" fill="#8bf3cd" font-size="19" font-weight="800">1. Ногоон дэвсгэртэй</text>
  <rect x="80" y="166" width="160" height="140" rx="8" fill="#00d84a"/>
  <text x="160" y="258" text-anchor="middle" font-size="76">🥋</text>
  <text x="160" y="330" text-anchor="middle" fill="#cdd3f5" font-size="14">AI ЯГ ингэж гаргадаг ✔</text>

  <text x="298" y="245" text-anchor="middle" fill="#ffd84d" font-size="34">→</text>

  <!-- step 2 -->
  <rect x="322" y="120" width="230" height="230" rx="18" fill="#1f2750" stroke="#52b9ff" stroke-width="3"/>
  <text x="437" y="152" text-anchor="middle" fill="#8dd2ff" font-size="19" font-weight="800">2. remove.bg</text>
  <text x="437" y="240" text-anchor="middle" font-size="64">🧼</text>
  <text x="437" y="286" text-anchor="middle" fill="#cdd3f5" font-size="15">ногооныг автоматаар</text>
  <text x="437" y="308" text-anchor="middle" fill="#cdd3f5" font-size="15">арилгана</text>
  <text x="437" y="332" text-anchor="middle" fill="#5f68a8" font-size="13">(chroma key)</text>

  <text x="575" y="245" text-anchor="middle" fill="#ffd84d" font-size="34">→</text>

  <!-- step 3 -->
  <rect x="599" y="120" width="230" height="230" rx="18" fill="#132a20" stroke="#ffd84d" stroke-width="4"/>
  <text x="714" y="152" text-anchor="middle" fill="#ffe57a" font-size="19" font-weight="800">3. Sprite бэлэн!</text>
  <rect x="634" y="166" width="160" height="140" rx="8" fill="url(#chk7b)"/>
  <text x="714" y="258" text-anchor="middle" font-size="76">🥋</text>
  <text x="714" y="330" text-anchor="middle" fill="#ffd84d" font-size="14">transparent PNG ✅</text>

  <!-- prompt box -->
  <rect x="70" y="374" width="760" height="102" rx="16" fill="#1b2348" stroke="#4ee6a8" stroke-width="2"/>
  <text x="450" y="402" text-anchor="middle" fill="#8bf3cd" font-size="17" font-weight="800">🔑 Промптод ЯГ ингэж бич — үг бүр чухал</text>
  <text x="450" y="432" text-anchor="middle" fill="#ffffff" font-size="16" font-family="monospace">"single solid color code bright green screen background"</text>
  <text x="450" y="462" text-anchor="middle" fill="#7f88c4" font-size="14">→ Frame бүрт ЯГ ижил ногоон гарна → бүгдийг ижил аргаар цэвэрлэнэ</text>
</svg>
